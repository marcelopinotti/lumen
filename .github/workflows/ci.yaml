name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    env:
      DATABASE_PASSWORD: postgres
      RABBITMQ_HOST: localhost
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lumen
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.3.5-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: lumen
          RABBITMQ_DEFAULT_PASS: lumen
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        module: [avaliador, cartoes, clientes, cloudgateway, eurekaserver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            modular/pom.xml
            ${{ matrix.module }}/pom.xml
      - run: mvn --batch-mode --no-transfer-progress verify
        working-directory: ${{ matrix.module }}
