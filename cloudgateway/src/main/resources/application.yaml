spring:
  application:
    name: cloudgateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: cartoes
              uri: lb://cartoes
              predicates:
                - Path=/api/cartoes/**
            - id: clientes
              uri: lb://clientes
              predicates:
                - Path=/api/clientes/**
            - id: avaliador
              uri: lb://avaliador
              predicates:
                - Path=/api/avaliador/**
server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
