services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  eurekaserver:
    build:
      context: .
      dockerfile: eurekaserver/Dockerfile
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-user-lumen}
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -qO- http://user-lumen:${EUREKA_PASSWORD:-user-lumen}@localhost:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clientes:
    build:
      context: .
      dockerfile: clientes/Dockerfile
    depends_on:
      eurekaserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lumen
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://user-lumen:${EUREKA_PASSWORD:-user-lumen}@eurekaserver:8761/eureka/

  cartoes:
    build:
      context: .
      dockerfile: cartoes/Dockerfile
    depends_on:
      eurekaserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lumen
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://user-lumen:${EUREKA_PASSWORD:-user-lumen}@eurekaserver:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lumen}

  avaliador:
    build:
      context: .
      dockerfile: avaliador/Dockerfile
    depends_on:
      eurekaserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://user-lumen:${EUREKA_PASSWORD:-user-lumen}@eurekaserver:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lumen}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}

  cloudgateway:
    build:
      context: .
      dockerfile: cloudgateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      eurekaserver:
        condition: service_healthy
      clientes:
        condition: service_started
      cartoes:
        condition: service_started
      avaliador:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://user-lumen:${EUREKA_PASSWORD:-user-lumen}@eurekaserver:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/msrealm/protocol/openid-connect/certs
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8081/realms/msrealm}

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lumen
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lumen}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    ports:
      - "8081:8080"
    volumes:
      - keycloak:/opt/keycloak/data

volumes:
  postgres_data:
  rabbitmq_data:
  keycloak:
